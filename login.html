<!DOCTYPE html>
<html class="fixed">
<head>
  <meta charset="UTF-8" />
  <title>Login | DeskHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.css" />
  <link rel="stylesheet" href="assets/vendor/font-awesome/css/font-awesome.css" />
  <link rel="stylesheet" href="assets/stylesheets/theme.css" />
  <link rel="stylesheet" href="assets/stylesheets/skins/default.css" />
  <style>
    body.login-page {
      min-height: 100vh;
      background:
        linear-gradient(rgba(61, 83, 105, 0.82), rgba(61, 83, 105, 0.82)),
        #3d5369 url('assets/images/loginbg1.jpg') no-repeat center center fixed;
      background-size: cover;
      background-attachment: fixed;
    }
    .panel.panel-sign,
    .panel.panel-sign .panel-body {
      background: #ffffff;
    }
  </style>
</head>
<body class="login-page">
  <section class="body-sign">
    <div class="center-sign">
      <div class="panel panel-sign">
        <div class="panel-body">
          <div class="text-center mb-lg">
            <a href="/" class="logo">
              <img src="assets/images/deskhub.png" height="50" alt="DeskHub" />
            </a>
          </div>
          <form id="loginForm">
            <div class="form-group mb-lg">
              <label>Username</label>
              <input name="username" id="username" type="text" class="form-control input-lg" required />
            </div>

            <div class="form-group mb-lg">
              <label>Password</label>
              <input name="password" id="password" type="password" class="form-control input-lg" required />
            </div>

            <div class="checkbox mt-sm">
              <label>
                <input type="checkbox" id="rememberLogin"> Remember my login info
              </label>
            </div>
            <div class="checkbox">
              <label>
                <input type="checkbox" id="rememberPassword"> Remember my password (stores it on this device)
              </label>
            </div>
			  
			   <div class="row">
              <div class="col-sm-12 text-right">
                <label>     </label>
              </div>
            </div>
			  
            <div class="row">
              <div class="col-sm-12 text-right">
                <button type="submit" class="btn btn-primary hidden-xs">Login</button>
              </div>
            </div>
            <p id="errorMsg" class="text-danger text-center mt-md"></p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="assets/vendor/jquery/jquery.js"></script>
  <script src="script.js"></script>
</body>
</html>
